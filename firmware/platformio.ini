[platformio]
default_envs = h717, k191

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.offset_address = 0x20000
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_speed = 460800
platform_packages = platformio/tool-mklittlefs@^1.203.210628
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -Wl,--wrap=tud_descriptor_bos_cb
    -Igenerated

[env:h717]
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<ui_k191.cpp>

[env:k191]
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions-k191.csv
board_build.arduino.memory_type = qio_qspi
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags = ${env.build_flags} -DPARALINK_K191 -include include/k191_display_setup.h
build_src_filter = +<*> -<ui.cpp> -<panel.cpp>
